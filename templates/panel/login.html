{% extends "base.html" %}
{% block title %}Administración · Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center pt-4"><div class="col-md-6 col-lg-5">
  <h1 class="h2 mb-4">Acceso de administrador</h1>
  <form method="post" class="panel p-4">{% csrf_token %}
    <label class="form-label fw-semibold" for="id_username">Usuario</label>
    <input id="id_username" name="username" class="form-control mb-3" required autofocus autocomplete="username">
    <label class="form-label fw-semibold" for="id_password">Contraseña</label>
    <input id="id_password" name="password" type="password" class="form-control mb-4" required autocomplete="current-password">
    <button class="btn btn-primary w-100">Ingresar</button>
  </form>
  <p class="text-center mt-4 small"><a href="{% url 'login_estudiante' %}" class="text-secondary">Volver al acceso de estudiantes</a></p>
</div></div>
{% endblock %}
