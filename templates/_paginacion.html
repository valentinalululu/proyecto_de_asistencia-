{% if page.paginator.num_pages > 1 %}
<nav aria-label="Paginación" class="mt-3">
  <ul class="pagination justify-content-center mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ qs }}page={{ page.previous_page_number }}">Anterior</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ page.number }} de {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ qs }}page={{ page.next_page_number }}">Siguiente</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
