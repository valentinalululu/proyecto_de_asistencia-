<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Control de asistencia{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #17233B; --accent: #1E6F8C; --paper: #F2F5F8;
      --ok: #1F8A5B; --bad: #C2413B; --warn: #B7791F;
      --bs-body-font-family: "Public Sans", system-ui, sans-serif;
      --bs-body-bg: var(--paper); --bs-body-color: var(--ink);
      --bs-primary: var(--accent); --bs-primary-rgb: 30,111,140;
    }
    .btn-primary { --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: #17586f; --bs-btn-hover-border-color: #17586f;
      --bs-btn-active-bg: #124a5e; --bs-btn-active-border-color: #124a5e; }
    .topbar { background: var(--ink); }
    .topbar .nav-link { color: #c9d3e6; padding: .35rem .8rem; border-radius: .4rem; }
    .topbar .nav-link:hover { color: #fff; }
    .topbar .nav-link.active { color: #fff; background: rgba(255,255,255,.12); }
    .brand { font-weight: 700; letter-spacing: -.01em; color: #fff; text-decoration: none; }
    h1, h2, h3 { letter-spacing: -.015em; font-weight: 700; }
    .panel { background: #fff; border: 1px solid #dde3ec; border-radius: .6rem; }
    .stat { font-size: 2rem; font-weight: 700; line-height: 1; }
    .badge-estado { font-weight: 600; padding: .4em .7em; border-radius: 2rem; }
    .e-PRESENTE { background: #dff3e9; color: var(--ok); }
    .e-FALTA { background: #f9e1df; color: var(--bad); }
    .e-PENDIENTE { background: #fbefd5; color: var(--warn); }
    .e-PROGRAMADA { background: #e6eaf1; color: #5b6880; }
    .table > :not(caption) > * > * { padding: .7rem .9rem; }
    .table thead th { font-weight: 600; color: #5b6880; border-bottom-width: 1px; }
    tr.hoy td { background: #eef6fa; }
    .btn-mark { font-size: 1.15rem; padding: 1rem 2rem; font-weight: 600; }
    :focus-visible { outline: 3px solid #7fc0d6; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <main class="container py-4" style="max-width: 1080px;">
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
